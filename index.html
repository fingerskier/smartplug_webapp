<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Switch a Shelly 1PM Mini Gen4 on and off over Bluetooth" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>PBM Plug</title>
  </head>
  <body>
    <main>
      <header>
        <img src="/logo192.png" alt="" width="72" height="72" />
        <h1>PBM Plug</h1>
      </header>

      <p id="status" role="status" aria-live="polite">Not connected</p>

      <button id="power" class="power" type="button" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v9" />
          <path d="M6.3 7.2a8 8 0 1 0 11.4 0" />
        </svg>
        <span id="power-label">Off</span>
      </button>

      <button id="connect" class="connect" type="button">Connect</button>

      <p id="message" class="message" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
